version: "2"
run:
  timeout: 1m
  issues-exit-code: 1
  tests: true
linters:
  default: none
  enable:
    - bodyclose
    - depguard
    - dogsled
    - dupl
    - errcheck
    - exhaustive
    - funlen
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - mnd
    - nakedret
    - noctx
    - nolintlint
    - rowserrcheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    depguard:
      rules:
        main:
          # Keep the previous unrestricted import policy.
          list-mode: lax
          allow:
            - $gostd
    dupl:
      threshold: 100
    errcheck:
      check-type-assertions: false
      check-blank: true
    goconst:
      min-len: 2
      min-occurrences: 2
    gocritic:
      disabled-checks:
        - wrapperFunc
        - dupImport
        - ifElseChain
        - octalLiteral
      enabled-tags:
        - performance
        - style
        - diagnostic
        - opinionated
      settings:
        captLocal:
          paramsOnly: true
        rangeValCopy:
          sizeThreshold: 256
    gocyclo:
      min-complexity: 15
    lll:
      line-length: 160
      tab-width: 1
    misspell:
      locale: US
    nakedret:
      max-func-lines: 30
    prealloc:
      simple: true
      range-loops: true
      for-loops: false
    unparam:
      check-exported: false
  exclusions:
    generated: lax
    rules:
      - linters:
          - staticcheck
        text: 'ST1000: at least one file in a package should have a package comment'
      - linters:
          - dogsled
        path: (rticonnextdds_connector_test|example_test).go
        text: declaration has 3 blank identifiers
      - linters:
          - errcheck
        path: rticonnextdds_connector_test.go
        text: Error return value of `connector.Delete` is not checked
      - linters:
          - gocritic
        path: .go
        text: 'dupSubExpr: suspicious identical LHS and RHS for `==` operator'
      - linters:
          - funlen
        path: rticonnextdds_connector_test.go
    paths:
      - third_party$
      - builtin$
      - (^|/)examples/
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - (^|/)examples/
